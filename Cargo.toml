[workspace]
resolver = "3"
# own lock file, see its Cargo.toml
exclude = ["crates/rynas-files-worker", "crates/rynas-backup-worker"]
members = [
    "crates/rynas-api-types",
    "crates/rynas-auth",
    "crates/rynas-storage",
    "crates/rynas-web",
    "crates/rynasd",
    "crates/rynas-config",
    "crates/rynas-tasks",
    "crates/rynas-services",
    "crates/rynas-notify",
    "crates/rynas-btrfs",
    "crates/rynas-scheduler",
    "crates/rynas-net",
    "crates/rynas-ui",
    "crates/rynas-hw",
    "crates/rynas-hw-synology",
    "crates/rynas-power",
    "crates/rynas-http",
    "crates/rynas-updates",
    "crates/rynas-nut",
    "crates/rynas-files",
    "crates/rynas-removable",
    "crates/rynas-module",
    "crates/rynas-apps",
    "crates/rynas-docker",
    "crates/rynas-tls",
    "crates/rynas-dns",
    "crates/rynas-tailscale",
    "crates/rynas-backup",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Marco Ziliani"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/rylos/rynas"
rust-version = "1.90"

[workspace.dependencies]
rynas-api-types = { path = "crates/rynas-api-types" }
rynas-auth = { path = "crates/rynas-auth" }
rynas-config = { path = "crates/rynas-config" }
rynas-tasks = { path = "crates/rynas-tasks" }
rynas-services = { path = "crates/rynas-services" }
# without the engine (trait + checks); rynasd enables `engine`
rynas-notify = { path = "crates/rynas-notify", default-features = false }
rynas-btrfs = { path = "crates/rynas-btrfs" }
rynas-scheduler = { path = "crates/rynas-scheduler" }
rynas-net = { path = "crates/rynas-net" }
rynasd = { path = "crates/rynasd" }
rynas-storage = { path = "crates/rynas-storage" }
rynas-hw = { path = "crates/rynas-hw" }
# the Synology module; without `domain` only the status, commands and provider (rynas-web);
# rynasd enables `domain` (its daemon side)
rynas-hw-synology = { path = "crates/rynas-hw-synology", default-features = false }
rynas-power = { path = "crates/rynas-power" }
rynas-http = { path = "crates/rynas-http" }
rynas-updates = { path = "crates/rynas-updates" }
rynas-nut = { path = "crates/rynas-nut" }
rynas-files = { path = "crates/rynas-files" }
rynas-removable = { path = "crates/rynas-removable" }
rynas-module = { path = "crates/rynas-module" }
rynas-tls = { path = "crates/rynas-tls" }
rynas-dns = { path = "crates/rynas-dns" }
# HTTPS of rynas-web (D-PROXY emergency port): the ring provider only, no aws-lc C build
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
rynas-apps = { path = "crates/rynas-apps" }
rynas-docker = { path = "crates/rynas-docker" }
rynas-tailscale = { path = "crates/rynas-tailscale" }
rynas-backup = { path = "crates/rynas-backup" }
# local time zone arithmetic of the power schedule (DST-safe); the system tz database
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# servers (rynas-web, rynasd, rynas-auth)
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1.54.1", features = ["rt", "net", "time", "sync", "signal", "fs", "macros"] }
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }
libc = "0.2.191"
sha2 = "0.11.1"
base64 = "0.23.1"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
argon2 = "0.6.0"
totp-rs = { version = "6.0.0", default-features = false, features = ["std"] }
getrandom = "0.4.3"
subtle = "2.6.1"
toml = "1.2.0"
nix = { version = "0.31.3", features = ["user", "fs"] }
# configuration store and tasks (rynas-config, rynas-tasks). System libsqlite3 and libzstd
# (Debian security updates; cargo-deb adds libsqlite3-0 / libzstd1 as dependencies)
rusqlite = { version = "0.41.1", features = ["backup"] }
minijinja = { version = "3.0.5", default-features = false, features = ["builtins", "serde"] }
age = { version = "0.12.1", default-features = false }
zstd = { version = "0.14.3", default-features = false, features = ["pkg-config"] }
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
zbus = { version = "6.2.1", default-features = false, features = ["tokio", "proxy"] }
tokio-util = "0.7.20"
pam-client = { version = "0.5.0", default-features = false }
# web UI (crates/rynas-ui)
leptos = { version = "0.8.23", features = ["csr"] }
leptos_router = "0.8"
wasm-bindgen = "0.2.105"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1.7"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Built for size where it pays (review 2026-11-07, M9): on a NAS the daemons are idle most
# of the time and their resident set is mostly their own code pages (the page cache maps
# whole large folios: ~95 % of .text is resident at start). Measured idle RSS of rynasd
# with the dry instance: 23.8 MB at opt-level 3 (heap 2.7 MB, .text 16.8 MB), 20.6 MB
# with "s", 19.6 MB with "z" (.text 12.3 MB). rynasd is a control-plane daemon: its fat
# LTO pass runs at its own level, so "z" covers everything linked into it. rynas-web keeps
# level 3 for itself (it serves files and streams); its dependencies are built with "s",
# and the crates where speed matters keep full optimization below.
[profile.release.package."*"]
opt-level = "s"
[profile.release.package.rynasd]
opt-level = "z"
# a package override does not inherit `strip` from the profile
strip = true
[profile.release.package.argon2]
opt-level = 3
[profile.release.package.blake2]
opt-level = 3
[profile.release.package.ring]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3
[profile.release.package.sha1]
opt-level = 3
[profile.release.package.scrypt]
opt-level = 3
[profile.release.package.salsa20]
opt-level = 3
[profile.release.package.zstd-sys]
opt-level = 3

# the wasm UI is size-sensitive
[profile.release.package.rynas-ui]
opt-level = "z"

# argon2 is unusably slow without optimizations: keep tests and debug builds realistic
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
# same for the scrypt passphrase recipient of age (.rynasbak secrets)
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
