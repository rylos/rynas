name: Renovate (app catalogue)

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: renovatebot/github-action@v46.3.10
        with:
          configurationFile: .github/renovate-config.js
          # a fine-grained token (contents, pull requests, workflows read): pull requests
          # opened with GITHUB_TOKEN would not start the catalogue tests
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: info
