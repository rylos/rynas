# Shipped by rynas. rynas runs btrbk with its own configurations (/etc/rynas/btrbk/*.conf)
# from its own timers; Debian's btrbk.timer runs plain `btrbk run` every night, which fails
# without /etc/btrbk/btrbk.conf. Skip it (condition, not failure) until the administrator
# writes that file; with it, Debian's timer works as usual.
[Unit]
ConditionPathExists=|/etc/btrbk/btrbk.conf
ConditionPathExists=|/etc/btrbk.conf
