# Shipped by rynas: the scheduling gate for the md RAID check (mdadm).
# A start of this unit asks rynasd first, like rynas's own scheduled tasks: it respects
# "Pause all" and its own pause on the Task Scheduler page, waits while other work holds the
# package system or the disks it needs, and is recorded in the task's history. When rynasd
# cannot be reached the start runs as before, after at most 20 seconds. A start the gate
# skips is a failed condition, not a failed unit. Without mdcheck_start.service on the
# system this file does nothing.
[Service]
ExecCondition=+/usr/libexec/rynas/rynasctl gate mdcheck-start
ExecStopPost=+/usr/libexec/rynas/rynasctl task-finished mdcheck-start
