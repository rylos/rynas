# rynas: the network counts as online once one port is. rynas writes a systemd-networkd file
# for every port, a port without a cable included (DHCP and link-local stay ready for when
# one is plugged in): waiting for all of them held network-online.target, and with it the
# remote file systems and the logins, for ever. An administrator's drop-in in /etc wins.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any
