# rynas already throttles logins itself; fail2ban adds a firewall ban for persistent
# guessers. Behind rynas-caddy the logged address is the real client (the
# proxy's X-Forwarded-For, trusted from loopback only), so the ban hits the
# client on every port it can reach the interface through.
[rynas]
enabled  = true
backend  = systemd
filter   = rynas
port     = 80,443,8080,8443
maxretry = 10
findtime = 10m
bantime  = 1h
