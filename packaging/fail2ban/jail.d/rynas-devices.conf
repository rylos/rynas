# rynas throttles the mobile devices' public routes itself (its own limiter,
# apart from the sign-in's); fail2ban adds a firewall ban for clients that keep
# guessing pairing codes or device signatures. Phones on mobile networks share
# addresses (CGNAT): keep maxretry generous.
[rynas-devices]
enabled  = true
backend  = systemd
filter   = rynas-devices
port     = 80,443,8080,8443
maxretry = 10
findtime = 10m
bantime  = 1h
