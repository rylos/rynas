# fail2ban filter for the mobile devices' public routes of rynas-web (pairing
# claim, poll, token refresh), e.g.
#   WARN device authentication failure from 192.0.2.10
# Only guesses are logged: an unknown pairing code or claim token, a signature
# of another key, an unknown device. Never matched by the sign-in filter
# (rynas.conf), and the sign-in failures never match this one.
[Definition]
failregex = device authentication failure from <HOST>\s*$
ignoreregex =
journalmatch = _SYSTEMD_UNIT=rynas-web.service
