# fail2ban filter for rynas-web login failures (journal or log file), e.g.
#   WARN authentication failure for admin from 192.0.2.10
# The address is the client's, also behind the built-in reverse proxy (never
# 127.0.0.1 for proxied requests): IPv4, or IPv6 without brackets.
[Definition]
failregex = authentication failure for \S+ from <HOST>\s*$
ignoreregex =
journalmatch = _SYSTEMD_UNIT=rynas-web.service
