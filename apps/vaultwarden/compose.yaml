# Upstream: https://github.com/dani-garcia/vaultwarden/wiki/Using-Docker-Compose
# The image has its own HEALTHCHECK.
services:
  vaultwarden:
    image: vaultwarden/server:1.37.5@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
    restart: unless-stopped
    ports:
      - "${RYNAS_BIND}:${WEB_PORT}:80"
    environment:
      DOMAIN: "${DOMAIN}"
      SIGNUPS_ALLOWED: "${SIGNUPS_ALLOWED}"
      TZ: "${TZ}"
    volumes:
      - ${DATA_FOLDER}:/data
