# Upstream: https://github.com/bpatrik/pigallery2/blob/master/docker/docker-compose/default/docker-compose.yml
# Differences: image pinned, no nginx (web access does that), runs as PUID:PGID (the image starts
# as root but works unprivileged, port 80 included), no 3G memory limit. The image has its own
# HEALTHCHECK on /heartbeat. Thumbnail threads stay on upstream's default, CPUs minus one.
services:
  pigallery2:
    image: bpatrik/pigallery2:3.5.2@sha256:d7a61b6daa410537064d4f661122545bc4d9b16cd91a3862d654c3555cb63992
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    ports:
      - "${RYNAS_BIND}:${WEB_PORT}:80"
    environment:
      TZ: "${TZ}"
      NODE_ENV: production
    volumes:
      - ${CONFIG_FOLDER}:/app/data/config
      - ${DB_FOLDER}:/app/data/db
      - ${TMP_FOLDER}:/app/data/tmp
      - ${PHOTOS}:/app/data/images:ro
