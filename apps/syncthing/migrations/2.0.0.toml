to = "2.0.0"
description = "Shared folders are now mounted at /shares/<share> instead of /data, and several can be chosen. The folder chosen before stays in the list (the stack's fallback folder as /shares/sync), but the folders inside Syncthing still point below /data: the Syncthing adoption (POST /api/v1/syncthing/adopt) moves them; otherwise change each folder path in Syncthing to /shares/<share>/... Until then those folders stop with an error, and nothing is deleted on the other devices."

[[ops]]
op = "rename"
from = "SYNC_SHARE"
to = "SYNC_SHARES"
