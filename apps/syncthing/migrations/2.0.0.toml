to = "2.0.0"
description = "Shared folders are now mounted at /shares/<share> instead of /data, and several can be chosen. The folder chosen before stays in the list (the stack's fallback folder as /shares/sync). After the update rynas moves every Syncthing folder below /data to the same place below /shares and rescans it; a folder whose .stfolder marker it cannot verify is paused instead (resume it in Syncthing once checked). If Syncthing does not answer, the folders keep the old path and stop with an error until it is changed in Syncthing; nothing is deleted on the other devices."

[[ops]]
op = "rename"
from = "SYNC_SHARE"
to = "SYNC_SHARES"
