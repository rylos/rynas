# Upstream: https://github.com/immich-app/immich/releases/download/v3.3.6/docker-compose.yml
# Differences: images pinned by tag and digest, no container_name, explicit environment
# instead of env_file, external library share, proxied port bound to ${RYNAS_BIND}.
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.4.0@sha256:7b7b575029168bfb9eb901d868ce7dbfda0d7818e78aaace29b7b8a08cd4e7d5
    restart: always
    ports:
      - "${RYNAS_BIND}:${WEB_PORT}:2283"
    environment:
      TZ: "${TZ}"
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      IMMICH_TRUSTED_PROXIES: "${RYNAS_TRUSTED_PROXIES}"
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - ${EXTERNAL_LIBRARY}:/mnt/external:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - redis
      - database
    healthcheck:
      disable: false

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.4.0@sha256:f4e7275c9fbd956ed7bccc738ac57890bcbd9f9c17844d2ea0b137e38a083454
    restart: always
    environment:
      TZ: "${TZ}"
    volumes:
      - model-cache:/cache
    healthcheck:
      disable: false

  redis:
    image: docker.io/valkey/valkey:9.0.7@sha256:7e1deda01b64ece3167d370ab5be3452d29734feec22cbcbc69b3a64f6859d6d
    restart: always
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    restart: always
    environment:
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      disable: false

volumes:
  model-cache:
