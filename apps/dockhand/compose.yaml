# Upstream: https://dockhand.pro/manual (installation, PUID/PGID, STACKS_DIR)
services:
  dockhand:
    image: fnsys/dockhand:v1.0.57@sha256:4fd64d32728c99e5caf39b952a17d85448ee0b8ae76e0961f719ba2e19013988
    restart: unless-stopped
    group_add:
      - "${DOCKER_GID}"
    ports:
      - "${RYNAS_BIND}:${WEB_PORT}:3000"
    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      DATA_DIR: /app/data
      STACKS_DIR: "${RYNAS_STACKS_DIR}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_FOLDER}:/app/data
      # same path inside and outside: relative binds of the stacks keep working
      - ${RYNAS_STACKS_DIR}:${RYNAS_STACKS_DIR}
