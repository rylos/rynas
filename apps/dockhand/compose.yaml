# Upstream: https://dockhand.pro/manual (installation, PUID/PGID, STACKS_DIR)
services:
  dockhand:
    image: fnsys/dockhand:v1.0.59@sha256:c2b0fc55e3ed299133f6caf63a764deb118ee402ea761548c3f8fd01d04fca06
    restart: unless-stopped
    group_add:
      - "${DOCKER_GID}"
    ports:
      - "${RYNAS_BIND}:${WEB_PORT}:3000"
    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      DATA_DIR: /app/data
      STACKS_DIR: "${RYNAS_STACKS_DIR}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_FOLDER}:/app/data
      # same path inside and outside: relative binds of the stacks keep working
      - ${RYNAS_STACKS_DIR}:${RYNAS_STACKS_DIR}
