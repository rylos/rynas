# Upstream: https://dockhand.pro/manual (installation, PUID/PGID, STACKS_DIR)
services:
  dockhand:
    image: fnsys/dockhand:v1.0.58@sha256:515c6e0f28cf3922c51a2dfd3463b972880e40418c2464b1bc91b8a3afe66c7f
    restart: unless-stopped
    group_add:
      - "${DOCKER_GID}"
    ports:
      - "${RYNAS_BIND}:${WEB_PORT}:3000"
    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      DATA_DIR: /app/data
      STACKS_DIR: "${RYNAS_STACKS_DIR}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_FOLDER}:/app/data
      # same path inside and outside: relative binds of the stacks keep working
      - ${RYNAS_STACKS_DIR}:${RYNAS_STACKS_DIR}
