# Upstream: https://getarcane.app/docs/setup/installation (compose.yaml, step 2)
services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:v2.17.3@sha256:2e0dc9f5ef03599181a49baf6470055d82e24d9cb15bbc62498ea642c0f882a7
    restart: unless-stopped
    cgroup: host
    group_add:
      - "${DOCKER_GID}"
    ports:
      - "${RYNAS_BIND}:${WEB_PORT}:3552"
    environment:
      APP_URL: "http://${RYNAS_HOST}:${WEB_PORT}"
      PUID: "${PUID}"
      PGID: "${PGID}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      PROJECTS_DIRECTORY: "${RYNAS_STACKS_DIR}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_FOLDER}:/app/data
      # same path inside and outside: relative binds of the stacks keep working
      - ${RYNAS_STACKS_DIR}:${RYNAS_STACKS_DIR}
    healthcheck:
      test: ["CMD", "arcane", "health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
