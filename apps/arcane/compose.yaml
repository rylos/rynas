# Upstream: https://getarcane.app/docs/setup/installation (compose.yaml, step 2)
services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:v3.1.0@sha256:4151e7bc42ddec87c2ce5534d7611297465e2b05e6472f12382073eeca878c8e
    restart: unless-stopped
    cgroup: host
    group_add:
      - "${DOCKER_GID}"
    ports:
      - "${RYNAS_BIND}:${WEB_PORT}:3552"
    environment:
      ARCANE_APP_URL: "http://${RYNAS_HOST}:${WEB_PORT}"
      PUID: "${PUID}"
      PGID: "${PGID}"
      ARCANE_ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      ARCANE_PROJECTS_DIRECTORY: "${RYNAS_STACKS_DIR}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_FOLDER}:/app/data
      # same path inside and outside: relative binds of the stacks keep working
      - ${RYNAS_STACKS_DIR}:${RYNAS_STACKS_DIR}
    healthcheck:
      test: ["CMD", "arcane", "health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
