# Upstream: https://github.com/paperless-ngx/paperless-ngx/blob/v3.4.2/docker/compose/docker-compose.postgres.yml
# Differences: images pinned, bind folders instead of named volumes for data, generated
# database password and secret key, admin account created at first start.
services:
  broker:
    image: docker.io/valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  db:
    image: docker.io/library/postgres:18.7@sha256:e754b839f447639b7004895f4d8a4bfcb4e9dbe3a1bc035f27f646562a16fd61
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      # PostgreSQL 18 images keep the data in a versioned folder below /var/lib/postgresql
      - ${DB_FOLDER}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 30s
      timeout: 5s
      retries: 5

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.5.1@sha256:8508853b8a0f8394074260957d0be186c8c64f346973b24a7583de4580f306b9
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started
    ports:
      - "${RYNAS_BIND}:${WEB_PORT}:8000"
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBPASS: "${DB_PASSWORD}"
      PAPERLESS_SECRET_KEY: "${SECRET_KEY}"
      PAPERLESS_TIME_ZONE: "${TZ}"
      PAPERLESS_OCR_LANGUAGE: "${PAPERLESS_OCR_LANGUAGE}"
      PAPERLESS_URL: "${PAPERLESS_URL}"
      PAPERLESS_ADMIN_USER: "${PAPERLESS_ADMIN_USER}"
      PAPERLESS_ADMIN_PASSWORD: "${PAPERLESS_ADMIN_PASSWORD}"
      PAPERLESS_TRUSTED_PROXIES: "${RYNAS_TRUSTED_PROXIES}"
      USERMAP_UID: "${PUID}"
      USERMAP_GID: "${PGID}"
    volumes:
      - ${DATA_FOLDER}:/usr/src/paperless/data
      - ${MEDIA_FOLDER}:/usr/src/paperless/media
      - ${EXPORT_FOLDER}:/usr/src/paperless/export
      - ${CONSUME}:/usr/src/paperless/consume

volumes:
  redisdata:
