# Upstream: https://github.com/actualbudget/actual/blob/master/packages/sync-server/docker-compose.yml
# Differences: image pinned, runs as PUID:PGID (as Umbrel does), proxy trusted explicitly,
# upload limits raised for larger budgets (upstream defaults 20/20/50 MB).
services:
  actual:
    image: actualbudget/actual-server:26.11.0@sha256:06cf186569cf58d93e12659ff1a517b65b5b0ebee7050a3991d4bd8a1d398da6
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    ports:
      - "${RYNAS_BIND}:${WEB_PORT}:5006"
    environment:
      ACTUAL_TRUSTED_PROXIES: "${RYNAS_TRUSTED_PROXIES}"
      ACTUAL_UPLOAD_FILE_SIZE_LIMIT_MB: "100"
      ACTUAL_UPLOAD_FILE_SYNC_SIZE_LIMIT_MB: "100"
      ACTUAL_UPLOAD_SYNC_ENCRYPTED_FILE_SYNC_SIZE_LIMIT_MB: "100"
    volumes:
      - ${DATA_FOLDER}:/data
    healthcheck:
      test: ["CMD-SHELL", "node scripts/health-check.js"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
