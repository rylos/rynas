# Upstream: https://github.com/louislam/dockge/blob/1.5.0/compose.yaml
services:
  dockge:
    image: louislam/dockge:1.5.0@sha256:335c6368b880ecc203236ed89e6e5232e0d6578e8ef5920e4a502390451502bf
    restart: unless-stopped
    ports:
      - "${RYNAS_BIND}:${WEB_PORT}:5001"
    environment:
      DOCKGE_STACKS_DIR: "${RYNAS_STACKS_DIR}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_FOLDER}:/app/data
      # full path, same on both sides (upstream requirement)
      - ${RYNAS_STACKS_DIR}:${RYNAS_STACKS_DIR}
