# Simplified Chinese texts of the entry, by the field of app.toml and form.json they
# translate (docs/phase2/docker-apps.md § 6.14). The long description is zh-CN.md.

description = "面向文件托管网站和链接的下载管理器，可在浏览器内使用桌面界面。"

[ports]
web.purpose = "网页界面（浏览器中的 JDownloader 桌面）"
myjd.purpose = "MyJDownloader 应用和浏览器扩展的局域网直连"

[folders]
CONFIG_FOLDER.description = "JDownloader 设置、账户、下载列表和日志"

[shares]
DOWNLOADS.label = "下载文件"
DOWNLOADS.description = "存放已完成下载的共享文件夹，挂载到 /output。"

[secrets]
WEB_PASSWORD.description = "网页界面密码（用户名为 admin）"

[[notes]]
text = "使用 admin 和安装时显示的密码登录。要使用 MyJDownloader 手机应用和浏览器扩展，请在 JDownloader 的 Settings → MyJDownloader 中设置账户。"

[[notes]]
text = "下载操作使用应用运行账户在目标目录上的权限。请给该账户授予此共享文件夹的写入权限。"

