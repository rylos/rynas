# Upstream: https://github.com/louislam/uptime-kuma/blob/2.5.9/compose.yaml
# The image has its own HEALTHCHECK.
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.11@sha256:7554dba313c84e44fee921ef3b5626ba1c711e412e82815e8c957517026112a9
    restart: unless-stopped
    ports:
      - "${RYNAS_BIND}:${WEB_PORT}:3001"
    environment:
      TZ: "${TZ}"
    volumes:
      - ${DATA_FOLDER}:/app/data
