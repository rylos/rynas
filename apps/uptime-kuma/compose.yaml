# Upstream: https://github.com/louislam/uptime-kuma/blob/2.5.9/compose.yaml
# The image has its own HEALTHCHECK.
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.12@sha256:8e4b6bef96417ec98a35dc103c99cc64fc229a01e584e56d95d9004d2003c02a
    restart: unless-stopped
    ports:
      - "${RYNAS_BIND}:${WEB_PORT}:3001"
    environment:
      TZ: "${TZ}"
    volumes:
      - ${DATA_FOLDER}:/app/data
