# Upstream: https://github.com/louislam/uptime-kuma/blob/2.5.9/compose.yaml
# The image has its own HEALTHCHECK.
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.9@sha256:e88415a90dd2f7efecdbc18de0490aff292764a3ac471531bf1d0481725591bd
    restart: unless-stopped
    ports:
      - "${RYNAS_BIND}:${WEB_PORT}:3001"
    environment:
      TZ: "${TZ}"
    volumes:
      - ${DATA_FOLDER}:/app/data
