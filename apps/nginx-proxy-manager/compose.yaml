# Upstream: https://nginxproxymanager.com/setup/ (Docker Compose)
# Differences: image pinned, first administrator created from INITIAL_ADMIN_EMAIL/PASSWORD
# (since 2.13 there is no default account), the opt-in healthcheck switched on, and
# host.docker.internal pointing at the host (as the TrueNAS app does) so proxy hosts can reach
# apps published on the NAS. Runs as root like upstream: with PUID/PGID binding 80 can fail.
services:
  app:
    image: jc21/nginx-proxy-manager:2.16.0@sha256:4393e642e233e5efd5adeb7f10918d4aaea71c9ed875b94190273fc8e87f9594
    restart: unless-stopped
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
      - "${RYNAS_BIND}:${ADMIN_PORT}:81"
    environment:
      TZ: "${TZ}"
      INITIAL_ADMIN_EMAIL: "${INITIAL_ADMIN_EMAIL}"
      INITIAL_ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      DB_SQLITE_FILE: /data/database.sqlite
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${DATA_FOLDER}:/data
      - ${LETSENCRYPT_FOLDER}:/etc/letsencrypt
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
