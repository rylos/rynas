[package]
name = "rynas-files"
description = "rynas file manager core: file operations as the logged-in user, transfers, archives, remote servers"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true


[dependencies]
rynas-api-types.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
crc32fast = "1.5.3"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
aes-gcm = "0.10.3"
sha2 = { version = "0.10.9", default-features = false }
nom-exif = "3.8.0"

[dev-dependencies]
tempfile.workspace = true
