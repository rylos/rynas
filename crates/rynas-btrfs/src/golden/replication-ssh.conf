# ssh settings of the rynas snapshot replication (root's connections to its targets).
Match originalhost backup.lan user btrbk localuser root
    UserKnownHostsFile /etc/rynas/ssh/known_hosts
    StrictHostKeyChecking yes
    BatchMode yes
    IdentitiesOnly yes
    ConnectTimeout 20
    ServerAliveInterval 30
    ServerAliveCountMax 4
