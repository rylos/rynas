# btrbk configuration of the rynas snapshot job "docs".
# Generated from the `snapshots` configuration key: edit the job in rynas.
# Run by the scheduler task snapshot-docs: btrbk -c /etc/rynas/btrbk/docs.conf run
timestamp_format        long
snapshot_create         always
snapshot_preserve_min   1d
snapshot_preserve       24h 14d 8w 12m
lockfile                /run/lock/rynas-btrbk-docs.lock

volume /srv/vol1
  snapshot_dir .snapshots/docs
  subvolume docs
    snapshot_name docs
