[package]
name = "rynas-notify"
description = "rynas notifications: the Notifier interface, health checks that emit events, and the engine (targets, rules, outbox)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# The engine (SQLite, SMTP, HTTP channels, templates) runs in rynasd only. Without it the
# crate is the `Notifier` trait, the event helpers and the stateful checks, which rynas-web
# and other crates use without linking the engine.
default = ["engine"]
engine = [
    "dep:rusqlite", "dep:minijinja", "dep:age", "dep:lettre", "dep:reqwest", "dep:regex-lite",
    "dep:tokio", "dep:sha2", "dep:jiff", "dep:rynas-tz",
    "dep:p256", "dep:hkdf", "dep:sha2-hkdf", "dep:aes-gcm", "dep:getrandom", "dep:base64",
]

[dependencies]
rynas-api-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
rusqlite = { workspace = true, optional = true }
minijinja = { workspace = true, optional = true, features = ["json"] }
age = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "time", "sync", "macros"] }
# quiet hours in the system's local time, read again when the zone changes
jiff = { workspace = true, optional = true }
rynas-tz = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
regex-lite = { version = "0.1.9", optional = true }
# OpenSSL through native-tls, like the system libsqlite3/libzstd: Debian security updates
lettre = { version = "0.11.23", optional = true, default-features = false, features = [
    "builder", "smtp-transport", "tokio1", "tokio1-native-tls", "hostname",
] }
reqwest = { version = "0.13.5", optional = true, default-features = false, features = [
    "native-tls-no-alpn",
] }

# Web Push to paired mobile devices (RFC 8291 `aes128gcm`): the versions already in the tree
# (age, hpke); hkdf 0.12 goes with sha2 0.10
p256 = { version = "0.13.2", optional = true, default-features = false, features = ["ecdh", "pkcs8"] }
hkdf = { version = "0.12.4", optional = true }
sha2-hkdf = { package = "sha2", version = "0.10.9", optional = true }
aes-gcm = { version = "0.10.3", optional = true, default-features = false, features = ["aes", "alloc"] }
getrandom = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync", "macros", "net", "io-util"] }

[[test]]
name = "engine"
required-features = ["engine"]
