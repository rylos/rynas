[package]
name = "rynas-files-worker"
description = "rynas file manager worker: started by rynasd as the logged-in user for file requests and transfers, with the SMB and SFTP clients"
version = "0.1.0"
edition = "2024"
authors = ["Marco Ziliani"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/rylos/rynas"
rust-version = "1.93"

# A workspace of its own, with its own Cargo.lock: the SMB client (smb → sspi) and the SSH
# client (russh) pin release candidates of RustCrypto crates that cannot share one lock
# file with the rest of rynas (argon2, sha2 0.11). Nothing of it links into rynasd or
# rynas-web; it shares the file manager core (`rynas-files`) by path.
# Build and test it with `--manifest-path crates/rynas-files-worker/Cargo.toml`.
[workspace]
exclude = ["vendor"]

# smb 0.12.1 (MIT, https://github.com/afiffon/smb-rs) with one fix, in
# vendor/smb/src/connection/worker/worker_trait.rs (look for "rynas patch"): the credits
# granted in an interim STATUS_PENDING response are counted. Without it a server that
# answers reads asynchronously (Samba does after 0.5 s) drains the client's credits and the
# transfer stops for good. Drop the copy once a release counts them.
#
# smb-transport 0.12.1 (MIT, same repository), in vendor/smb-transport/src/tcp/transport.rs
# ("rynas patch"): TCP_NODELAY on the socket (each request is two writes; with Nagle every
# round trip waited up to 40 ms for a delayed ACK), and a read timeout of the receive loop's
# poll no longer drops a message it hit halfway (which broke the connection for good).
[patch.crates-io]
smb = { path = "vendor/smb" }
smb-transport = { path = "vendor/smb-transport" }

[[bin]]
name = "rynas-files-worker"
path = "src/main.rs"

[dependencies]
rynas-files = { path = "../rynas-files" }
rynas-api-types = { path = "../rynas-api-types" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# remote connections: SMB 2/3 and SFTP, pure Rust (the versions SynoFile ships)
smb = { version = "0.12.1", default-features = false, features = ["multi_threaded", "sign", "encrypt"] }
russh = { version = "0.65.1", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3.0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# the ciphers' own speed, for packaging/bench-sftp.sh (the same library russh encrypts with)
ring = "0.17"
# Compress to .tar.zst in this process: the system libzstd (as rynasd links it), with its
# worker threads; tar without xattrs (the archive keeps names, modes, times and links)
zstd = { version = "0.14.3", default-features = false, features = ["pkg-config", "zstdmt"] }
tar = { version = "0.4.46", default-features = false }

[dev-dependencies]
tempfile = "3"
# the fake SFTP server of the tests speaks russh-sftp's own packets
bytes = "1"
# the transport itself, for the test of a message that arrives with a pause inside
smb-transport = { version = "0.12.1", default-features = false, features = ["is_sync"] }
# the implementation the vendored smb crate used before ring, as the reference for
# tests/smb_crypto.rs
aes-gcm = "0.11"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
