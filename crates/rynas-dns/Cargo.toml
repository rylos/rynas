[package]
name = "rynas-dns"
description = "rynas DNS: provider clients that write the LAN records of own domains, record planning, a minimal DNS resolver client and DNS rebind detection"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
rynas-api-types.workspace = true
serde.workspace = true
serde_json.workspace = true
getrandom.workspace = true
hex = "0.4.3"
# OVH request signatures ("$1$" + SHA-1 hex)
sha1 = "0.11.0"
# the same HTTP stack as rynas-notify (OpenSSL through native-tls: Debian security updates)
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls-no-alpn", "blocking"] }

[dev-dependencies]
