# Samba configuration generated by rynas from the `shares` configuration key.
# Use the rynas web interface (or the extra options there): edits here are reported as drift.

[global]
   server role = standalone server
   workgroup = WORKGROUP
   server string = rynas %h
   security = user
   passdb backend = tdbsam
   map to guest = never
   obey pam restrictions = yes
   unix password sync = no
   server min protocol = SMB2_10
   disable netbios = yes
   smb ports = 445
   server multi channel support = yes
   server smb encrypt = default
   multicast dns register = no
   access based share enum = yes
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:nfs_aces = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes
   fruit:model = MacSamba
   inherit acls = yes
   map acl inherit = yes
   store dos attributes = yes
   ea support = yes
   spotlight backend = noindex
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   logging = systemd
   log level = 1 auth_audit:3

[docs]
   path = /srv/vol1/docs
   comment = Office documents
   browseable = yes
   read only = yes
   valid users = carol @office
   write list = @office
   read list = carol
   invalid users = @interns
   create mask = 0666
   directory mask = 0777
   vfs objects = catia fruit streams_xattr shadow_copy2 recycle btrfs
   recycle:repository = #recycle
   recycle:keeptree = yes
   recycle:versions = yes
   recycle:touch = yes
   recycle:directory_mode = 0770
   recycle:exclude = *.tmp,~$*,.~lock*
   shadow:snapdir = /srv/vol1/.snapshots
   shadow:snapprefix = ^docs$
   shadow:delimiter = .
   shadow:format = %Y%m%dT%H%M
   shadow:localtime = yes
   shadow:sort = desc
   veto files = /@eaDir/#snapshot/.snapshots/lost+found/
   hide dot files = yes
   oplocks = no
   level2 oplocks = no
   kernel oplocks = yes

[media]
   path = /srv/vol1/media
   browseable = yes
   read only = yes
   valid users = @office
   read list = @office
   create mask = 0666
   directory mask = 0777
   vfs objects = catia fruit streams_xattr recycle btrfs
   recycle:repository = #recycle
   recycle:keeptree = yes
   recycle:versions = yes
   recycle:touch = yes
   recycle:directory_mode = 0770
   recycle:exclude = *.tmp,~$*,.~lock*
   veto files = /@eaDir/#snapshot/.snapshots/lost+found/
   hide dot files = yes
   server smb encrypt = required
   strict sync = yes

[scans]
   path = /srv/vol1/scans
   browseable = no
   read only = no
   vfs objects = catia fruit streams_xattr recycle
   recycle:repository = #recycle
   recycle:keeptree = yes
   recycle:versions = yes
   recycle:touch = yes
   recycle:directory_mode = 0770
   recycle:exclude = *.tmp,~$*,.~lock*
   veto files = /@eaDir/#snapshot/.snapshots/lost+found/
   hide dot files = yes
   case sensitive = yes
   preserve case = yes
   short preserve case = yes

[TimeMachine]
   path = /srv/vol1/tm
   browseable = yes
   read only = yes
   valid users = alice
   write list = alice
   create mask = 0666
   directory mask = 0777
   vfs objects = catia fruit streams_xattr
   veto files = /@eaDir/#snapshot/.snapshots/lost+found/
   hide dot files = yes
   fruit:time machine = yes
   fruit:time machine max size = 1T

# Shares of mounted removable drives, written by rynasd (setting "removable"); last, so
# the sections it adds start after every share above. A missing file is skipped.
include = /etc/samba/rynas-removable.conf
