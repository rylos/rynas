[package]
name = "rynas-hw-synology"
description = "rynas Synology module: synohwd hardware provider (status, /etc/synohwd.toml, FIFO commands, bay identify, fan curves) and, in rynasd, synodeb's UPS layer and notification forward"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# The daemon side of the module (the `synology.hw` configuration domain, synodeb's UPS layer
# and notification forward, the `rynas_module::Module`) runs in rynasd only. Without it the
# crate is the status parser, the model data, the commands and the provider, which rynas-web
# uses for /api/v1/hardware without linking the configuration store.
default = ["domain"]
domain = [
    "dep:rynas-config", "dep:toml", "dep:rynas-module", "dep:rynas-notify", "dep:rynas-nut",
    "dep:rynas-tasks", "dep:sha2", "dep:axum", "dep:rynas-http", "dep:rynas-power",
]

[dependencies]
rynas-api-types.workspace = true
rynas-hw.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
tracing.workspace = true
rynas-config = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
rynas-module = { workspace = true, optional = true }
rynas-notify = { workspace = true, optional = true }
rynas-nut = { workspace = true, optional = true }
rynas-tasks = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
rynas-http = { workspace = true, optional = true }
rynas-power = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
