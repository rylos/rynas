[package]
name = "rynasd"
description = "rynas privileged daemon: PAM, TOTP secrets and root operations behind a Unix socket"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
rynas-api-types.workspace = true
rynas-nut.workspace = true
rynas-removable.workspace = true
rynas-docker.workspace = true
rynas-auth.workspace = true
rynas-http.workspace = true
rynas-storage.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = { workspace = true, features = ["query"] }
tokio = { workspace = true, features = ["process", "io-util"] }
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
nix.workspace = true
libc.workspace = true
pam-client.workspace = true
rynas-config.workspace = true
rynas-tasks.workspace = true
rynas-services.workspace = true
rynas-notify = { workspace = true, features = ["engine"] }
rynas-btrfs.workspace = true
rynas-scheduler.workspace = true
rynas-hw.workspace = true
# the Synology module (D-MODULE): registered at start only on its hardware or system layer
rynas-hw-synology = { workspace = true, features = ["domain"] }
rynas-module.workspace = true
rynas-power.workspace = true
jiff.workspace = true
rynas-net.workspace = true
rynas-updates.workspace = true
rynas-files.workspace = true
tokio-util = { workspace = true, features = ["io"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
tokio = { workspace = true, features = ["io-util"] }
tempfile.workspace = true
rusqlite.workspace = true
http-body-util.workspace = true
