# Applies only to cargo runs started from this directory (trunk); builds of the server from the
# workspace root do not see this file. The wasm's optimization levels are the `wasm-release`
# profile in the root Cargo.toml.

# Leptos type erasure for views: much smaller wasm (-85 KB brotli measured on 2026-11-05),
# no measurable runtime cost for this UI.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", "erase_components"]
