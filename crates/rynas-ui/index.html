<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>rynas</title>
  <!-- theme before any CSS: no white flash (localStorage → prefers-color-scheme) -->
  <script>
    (function () {
      var d = document.documentElement, t = null, n = null;
      try { t = localStorage.getItem("rynas.theme"); n = localStorage.getItem("rynas.density"); } catch (e) {}
      var dark = t === "dark" || (t !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
      d.setAttribute("data-theme", dark ? "dark" : "light");
      d.setAttribute("data-density", n === "compact" ? "compact" : "comfortable");
      d.style.background = dark ? "#14171c" : "#e6e7ed";
      d.style.colorScheme = dark ? "dark" : "light";
      // Italian texts are a separate file (src/i18n.rs): fetched while the wasm loads
      var l = null;
      try { l = localStorage.getItem("rynas.lang"); } catch (e) {}
      if (l === "it" || (l !== "en" && /^it/i.test(navigator.language || ""))) {
        window.__rynasIt = fetch("/i18n/it.txt").then(function (r) { return r.ok ? r.text() : ""; }, function () { return ""; });
      }
      // Signed in last time: ask now for what the first screen needs, while the wasm is on its
      // way (src/api.rs takes these answers instead of asking again). Same requests, same rules:
      // a 401 just means the login screen. The list matches src/live.rs.
      var s = null;
      try { s = localStorage.getItem("rynas.sess"); } catch (e) {}
      if (s && window.AbortSignal && AbortSignal.timeout) {
        var early = window.__rynasEarly = {};
        ["/api/v1/auth/session", "/api/v1/system", "/api/v1/metrics/history?minutes=10", "/api/v1/storage", "/api/v1/hardware"].forEach(function (u) {
          // read to the end here: the timeout covers the body too, and on a slow link the wasm
          // may arrive after it. A failure is null: the page then asks by itself.
          early[u] = fetch(u, { headers: { Accept: "application/json" }, signal: AbortSignal.timeout(30000) })
            .then(function (r) {
              return r.blob().then(function (b) {
                var h = new Headers(r.headers);
                h.set("X-Rynas-Arrived", String(Date.now()));
                return new Response(b, { status: r.status, headers: h });
              });
            })
            .catch(function () { return null; });
        });
      }
    })();
  </script>
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link data-trunk rel="css" href="style/main.css">
  <link data-trunk rel="copy-dir" href="assets/fonts">
  <link data-trunk rel="copy-dir" href="assets/i18n">
  <link data-trunk rel="copy-file" href="assets/favicon.svg">
  <!-- the file manager (Web Component), loaded only by the Files page: pages/files.rs -->
  <link data-trunk rel="copy-dir" href="files-app">
  <link data-trunk rel="rust" data-bin="rynas-ui" data-wasm-opt="z" data-weak-refs data-cargo-profile-release="wasm-release">
  <style>
    #boot { position: fixed; inset: 0; display: grid; place-items: center; }
    #boot i { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #7aa2f7, #bb9af7); animation: boot 1s ease-in-out infinite alternate; }
    @keyframes boot { to { opacity: .35; transform: scale(.9); } }
    @media (prefers-reduced-motion: reduce) { #boot i { animation: none; } }
  </style>
</head>
<body>
  <div id="boot" aria-hidden="true"><i></i></div>
</body>
</html>
