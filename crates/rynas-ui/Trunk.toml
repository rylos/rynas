# trunk 0.22 — `trunk serve` (dev, :8081) / `trunk build --release` (dist/, embedded by rynas-web)
[build]
target = "index.html"
dist = "dist"
filehash = true
minify = "on_release"

# Hooks of one stage run concurrently: each post_build hook touches its own files only
# (hash-files-app.sh: files-app/ and index.html; i18n-bundle.sh: i18n/).

# the file manager's folder gets a content hash too (immutable caching): see the script
[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["hash-files-app.sh"]

# the translations: one file per language for the wasm (see the script)
[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["i18n-bundle.sh"]

[serve]
addresses = ["127.0.0.1"]
port = 8081
open = false

# API (and the SSE stream) from rynas-web during development
[[proxy]]
backend = "http://127.0.0.1:8080/api/"
